<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="fur" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffe6a1"/>
      <stop offset="55%" stop-color="#f5b954"/>
      <stop offset="100%" stop-color="#c67a1e"/>
    </radialGradient>
  </defs>
  <!-- body/head -->
  <ellipse cx="100" cy="115" rx="72" ry="60" fill="url(#fur)" stroke="#7a4a10" stroke-width="3"/>
  <!-- ears -->
  <polygon points="45,60 60,20 78,55" fill="#f5b954" stroke="#7a4a10" stroke-width="3"/>
  <polygon points="155,60 140,20 122,55" fill="#f5b954" stroke="#7a4a10" stroke-width="3"/>
  <polygon points="52,52 62,32 70,52" fill="#ffb3b3"/>
  <polygon points="148,52 138,32 130,52" fill="#ffb3b3"/>
  <!-- classic OIIA squinty eyes -->
  <g stroke="#2b1a06" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M62 100 q 12 -14 24 0"/>
    <path d="M114 100 q 12 -14 24 0"/>
  </g>
  <!-- open singing mouth -->
  <ellipse cx="100" cy="132" rx="14" ry="10" fill="#2b1a06"/>
  <ellipse cx="100" cy="136" rx="7" ry="4" fill="#ff5c8a"/>
  <!-- whiskers -->
  <g stroke="#2b1a06" stroke-width="2">
    <line x1="30" y1="120" x2="70" y2="125"/>
    <line x1="30" y1="132" x2="70" y2="132"/>
    <line x1="130" y1="125" x2="170" y2="120"/>
    <line x1="130" y1="132" x2="170" y2="132"/>
  </g>
  <!-- little blush -->
  <circle cx="60" cy="130" r="7" fill="#ff9d9d" opacity=".8"/>
  <circle cx="140" cy="130" r="7" fill="#ff9d9d" opacity=".8"/>
</svg>
