<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https:; media-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src https:;">
  <title>Grab an image from the web</title>
  <style>
    :root { --bar:#2a1a0c; --bar2:#3a2612; --accent:#c93a3a; --ink:#ffe9c2; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; background:#1b1206; }
    .chrome { display:flex; flex-direction:column; height:100vh; }
    .toolbar {
      display:flex; align-items:center; gap:8px; padding:10px 12px;
      background: linear-gradient(180deg, var(--bar2), var(--bar));
      color: var(--ink); border-bottom: 2px solid rgba(0,0,0,.5);
    }
    .nav-btn {
      width:34px; height:34px; border-radius:9px; border:1px solid rgba(255,255,255,.15);
      background: rgba(0,0,0,.28); color: var(--ink); cursor:pointer; font-size:16px;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .nav-btn:hover { background: rgba(0,0,0,.5); }
    .addr {
      flex:1; height:34px; border-radius:9px; border:1px solid rgba(0,0,0,.3);
      padding:0 12px; font-size:14px; background:#fff8ee; color:#2b1a06;
    }
    .quick {
      height:34px; padding:0 12px; border-radius:9px; border:none; cursor:pointer;
      background:#ffce3a; color:#5a3a10; font-weight:600; font-size:14px;
    }
    .quick:hover { background:#ffc21a; }
    .grabtoggle {
      height:34px; padding:0 12px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:600;
      border:1px solid rgba(255,255,255,.2); background: var(--accent); color:#fff;
    }
    .grabtoggle.off { background: rgba(0,0,0,.3); color: var(--ink); }
    .done {
      height:34px; padding:0 14px; border-radius:9px; border:none; cursor:pointer;
      background:#3ca35a; color:#fff; font-weight:600;
    }
    .hint {
      padding:7px 14px; font-size:12.5px; color:#ffe9c2; background: rgba(0,0,0,.35);
      border-bottom:1px solid rgba(0,0,0,.4);
    }
    .hint b { color:#ffce3a; }
    webview { flex:1; width:100%; border:0; background:#fff; }
    .toast {
      position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
      background:#3ca35a; color:#fff; padding:10px 18px; border-radius:999px; font-weight:600;
      box-shadow:0 8px 20px rgba(0,0,0,.4); opacity:0; transition: all .25s ease; pointer-events:none;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="chrome">
    <div class="toolbar">
      <button class="nav-btn" id="back" title="Back">‹</button>
      <button class="nav-btn" id="fwd" title="Forward">›</button>
      <button class="nav-btn" id="reload" title="Reload">⟳</button>
      <input class="addr" id="addr" placeholder="Search or type a web address…" />
      <button class="quick" id="qCats" title="Search cat memes">🐱 Cat memes</button>
      <button class="grabtoggle" id="grabToggle">Grab mode: ON</button>
      <button class="done" id="done">Done</button>
    </div>
    <div class="hint">
      <b>Grab mode</b> is on — click any picture on the page to add it to your board. Turn it off to browse & click links normally.
    </div>
    <webview id="wv" src="https://www.bing.com/images/search?q=cat+meme" partition="persist:corkmanager-web" webpreferences="contextIsolation=yes,sandbox=yes"></webview>
  </div>
  <div class="toast" id="toast">Added to your board ✓</div>

  <script>
    const wv = document.getElementById('wv');
    const addr = document.getElementById('addr');
    const toastEl = document.getElementById('toast');
    let grabMode = true;

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 1400);
    }

    function normalize(v) {
      v = (v || '').trim();
      if (!v) return '';
      if (/^https?:\/\//i.test(v)) return v;
      if (/^[\w-]+(\.[\w-]+)+.*$/.test(v) && !v.includes(' ')) return 'https://' + v;
      return 'https://www.bing.com/images/search?q=' + encodeURIComponent(v);
    }

    document.getElementById('back').onclick = () => { if (wv.canGoBack()) wv.goBack(); };
    document.getElementById('fwd').onclick = () => { if (wv.canGoForward()) wv.goForward(); };
    document.getElementById('reload').onclick = () => wv.reload();
    document.getElementById('qCats').onclick = () => wv.loadURL('https://www.bing.com/images/search?q=funny+cat+meme');
    document.getElementById('done').onclick = () => window.webpick.close();
    addr.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { const u = normalize(addr.value); if (u) wv.loadURL(u); }
    });

    const grabBtn = document.getElementById('grabToggle');
    grabBtn.onclick = () => {
      grabMode = !grabMode;
      grabBtn.textContent = 'Grab mode: ' + (grabMode ? 'ON' : 'OFF');
      grabBtn.classList.toggle('off', !grabMode);
      pushGrabMode();
    };

    function pushGrabMode() {
      wv.executeJavaScript('window.__cmGrab=' + (grabMode ? 'true' : 'false') + ';').catch(() => {});
    }

    // Injected into every page: click an image to grab it.
    const INJECT = `
      (function(){
        if (window.__cmInstalled) { window.__cmGrab = ${'${GRAB}'}; return; }
        window.__cmInstalled = true;
        window.__cmGrab = ${'${GRAB}'};
        function fullSize(el){
          if (!el || !el.closest) return '';
          // Bing image results: nearest a.iusc carries m="{...,\\"murl\\":\\"<full>\\"}"
          var iusc = el.closest('a.iusc');
          if (iusc && iusc.getAttribute('m')) {
            try { var j = JSON.parse(iusc.getAttribute('m')); if (j && j.murl) return j.murl; } catch(_){}
          }
          // Generic: an anchor that points straight at an image file
          var link = el.closest('a[href]');
          if (link) {
            var h = link.getAttribute('href') || '';
            var hl = h.toLowerCase().split('?')[0];
            var exts = ['.jpg','.jpeg','.png','.gif','.webp','.bmp'];
            for (var i=0;i<exts.length;i++){ if (hl.slice(-exts[i].length) === exts[i]) return h; }
          }
          return '';
        }
        document.addEventListener('click', function(e){
          if (!window.__cmGrab) return;
          var t = e.target;
          var img = t && t.closest ? t.closest('img') : null;
          var src = fullSize(t);
          if (!src && img) src = img.currentSrc || img.src || '';
          if (!src) {
            var bg = t ? getComputedStyle(t).backgroundImage : '';
            var m = bg && bg.match(/url\\(["']?(.*?)["']?\\)/);
            if (m) src = m[1];
          }
          if (src) {
            e.preventDefault(); e.stopPropagation();
            console.log('__CM_GRAB__' + src);
          }
        }, true);
      })();
    `;

    function inject() {
      wv.executeJavaScript(INJECT.replace(/\$\{GRAB\}/g, grabMode ? 'true' : 'false')).catch(() => {});
    }

    wv.addEventListener('dom-ready', () => { inject(); addr.value = wv.getURL(); });
    wv.addEventListener('did-navigate', (e) => { addr.value = e.url; });
    wv.addEventListener('did-navigate-in-page', (e) => { addr.value = e.url; });
    wv.addEventListener('console-message', (e) => {
      if (e.message && e.message.indexOf('__CM_GRAB__') === 0) {
        const url = e.message.slice('__CM_GRAB__'.length);
        window.webpick.grab(url);
        toast('Added to your board ✓');
      }
    });
  </script>
</body>
</html>
